---
- name: Bootstrap
  hosts: pse
  become: true
  tags:
    - bootstrap
  handlers:
    - name: Reload ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded
  tasks:
    - name: Update apt and upgrade installed packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        cache_valid_time: 3600

    - name: Install ufw and fail2ban
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create sudo user
      ansible.builtin.user:
        name: "{{ pse_user }}"
        password: "{{ pse_password | password_hash('sha512') }}"
        groups: sudo
        append: true
        shell: /bin/bash
        create_home: true
      no_log: true

    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: "/home/{{ pse_user }}/.ssh"
        state: directory
        owner: "{{ pse_user }}"
        group: "{{ pse_user }}"
        mode: "0700"

    - name: Install control node public key for the new user
      ansible.builtin.blockinfile:
        path: "/home/{{ pse_user }}/.ssh/authorized_keys"
        create: true
        owner: "{{ pse_user }}"
        group: "{{ pse_user }}"
        mode: "0600"
        marker: "# {mark} ANSIBLE MANAGED PSE KEY"
        block: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}"
      no_log: true

    - name: Passwordless sudo for the automation user
      ansible.builtin.copy:
        dest: /etc/sudoers.d/pse-automation
        content: "{{ pse_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      no_log: true

    - name: Allow SSH through the firewall
      ansible.builtin.command: "ufw allow {{ ansible_port }}/tcp"
      register: ufw_allow
      changed_when: "'Rule added' in ufw_allow.stdout"

    - name: Enable ufw
      ansible.builtin.command: ufw --force enable
      register: ufw_enable
      changed_when: "'Firewall is active and enabled' in ufw_enable.stdout"

    - name: Start and enable fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    - name: Disable root login and password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^[#\\s]*{{ item.directive }}\\s+\\S+"
        line: "{{ item.directive }} {{ item.value }}"
        validate: /usr/sbin/sshd -t -f %s
      loop:
        - { directive: PermitRootLogin, value: "no" }
        - { directive: PasswordAuthentication, value: "no" }
      notify: Reload ssh

- name: Docker Install
  hosts: pse
  become: true
  gather_facts: true
  vars:
    ansible_user: "{{ pse_user }}"
  tasks:
    - name: Assert a supported distribution
      ansible.builtin.assert:
        that:
          - ansible_distribution | lower in ['debian', 'ubuntu']
          - ansible_distribution_release | length > 0
        fail_msg: >-
          Docker install is not supported for {{ ansible_distribution }}
          (release '{{ ansible_distribution_release }}').
          Supported: debian, ubuntu.

    - name: Check whether Docker CE is already installed
      ansible.builtin.command: dpkg -s docker-ce
      register: docker_ce
      changed_when: false
      failed_when: false

    - name: Remove conflicting packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-doc
          - docker-buildx
          - podman-docker
          - containerd
          - runc
        state: absent
      when: docker_ce.rc != 0

    - name: Install repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Create the apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Fetch Docker official GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Detect the system architecture
      ansible.builtin.command: dpkg --print-architecture
      changed_when: false
      register: arch

    - name: Add the Docker apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/{{ ansible_distribution | lower }}
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Architectures: {{ arch.stdout }}
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Install DOCKER-USER firewall script
      ansible.builtin.copy:
        dest: /usr/local/sbin/pse-docker-user-rules
        mode: "0755"
        content: |
          #!/bin/sh
          set -e
          iptables -N DOCKER-USER 2>/dev/null || true
          iptables -F DOCKER-USER
          iptables -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN
          iptables -A DOCKER-USER -p tcp --dport 22 -j RETURN
          iptables -A DOCKER-USER -s 172.16.0.0/12 -j RETURN
          iptables -A DOCKER-USER ! -s 172.16.0.0/12 -j DROP

    - name: Install DOCKER-USER systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/pse-docker-user-rules.service
        mode: "0644"
        content: |
          [Unit]
          Description=Restore DOCKER-USER firewall rules
          After=docker.service
          Requires=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/sbin/pse-docker-user-rules
          ExecReload=/usr/local/sbin/pse-docker-user-rules

          [Install]
          WantedBy=multi-user.target

    - name: Enable DOCKER-USER rules
      ansible.builtin.systemd:
        name: pse-docker-user-rules
        daemon_reload: true
        enabled: true
        state: started

    - name: Allow the pse user to run docker without sudo
      ansible.builtin.user:
        name: "{{ pse_user }}"
        groups: docker
        append: true

    - name: Verify Docker works
      ansible.builtin.command: docker run hello-world
      changed_when: false
      register: hello
