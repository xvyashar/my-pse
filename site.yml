---
- name: Bootstrap
  hosts: pse
  become: true
  tags:
    - bootstrap
  handlers:
    - name: Reload ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded
  tasks:
    - name: Update apt and upgrade installed packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        cache_valid_time: 3600

    - name: Install ufw and fail2ban
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create sudo user
      ansible.builtin.user:
        name: "{{ pse_user }}"
        password: "{{ pse_password | password_hash('sha512') }}"
        groups: sudo
        append: true
        shell: /bin/bash
        create_home: true
      no_log: true

    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: "/home/{{ pse_user }}/.ssh"
        state: directory
        owner: "{{ pse_user }}"
        group: "{{ pse_user }}"
        mode: "0700"

    - name: Install control node public key for the new user
      ansible.builtin.blockinfile:
        path: "/home/{{ pse_user }}/.ssh/authorized_keys"
        create: true
        owner: "{{ pse_user }}"
        group: "{{ pse_user }}"
        mode: "0600"
        marker: "# {mark} ANSIBLE MANAGED PSE KEY"
        block: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}"
      no_log: true

    - name: Passwordless sudo for the automation user
      ansible.builtin.copy:
        dest: /etc/sudoers.d/pse-automation
        content: "{{ pse_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      no_log: true

    - name: Allow SSH through the firewall
      ansible.builtin.command: "ufw allow {{ ansible_port }}/tcp"
      register: ufw_allow
      changed_when: "'Rule added' in ufw_allow.stdout"

    - name: Enable ufw
      ansible.builtin.command: ufw --force enable
      register: ufw_enable
      changed_when: "'Firewall is active and enabled' in ufw_enable.stdout"

    - name: Start and enable fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    - name: Disable root login and password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^[#\\s]*{{ item.directive }}\\s+\\S+"
        line: "{{ item.directive }} {{ item.value }}"
        validate: /usr/sbin/sshd -t -f %s
      loop:
        - { directive: PermitRootLogin, value: "no" }
        - { directive: PasswordAuthentication, value: "no" }
      notify: Reload ssh

- name: Docker Install
  hosts: pse
  become: true
  gather_facts: true
  vars:
    ansible_user: "{{ pse_user }}"
    docker_allowed_ports:
      - 22
      - 80
  tasks:
    - name: Assert a supported distribution
      ansible.builtin.assert:
        that:
          - ansible_distribution | lower in ['debian', 'ubuntu']
          - ansible_distribution_release | length > 0
        fail_msg: >-
          Docker install is not supported for {{ ansible_distribution }}
          (release '{{ ansible_distribution_release }}').
          Supported: debian, ubuntu.

    - name: Check whether Docker CE is already installed
      ansible.builtin.command: dpkg -s docker-ce
      register: docker_ce
      changed_when: false
      failed_when: false

    - name: Remove conflicting packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-doc
          - docker-buildx
          - podman-docker
          - containerd
          - runc
        state: absent
      when: docker_ce.rc != 0

    - name: Install repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Create the apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Fetch Docker official GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Detect the system architecture
      ansible.builtin.command: dpkg --print-architecture
      changed_when: false
      register: arch

    - name: Add the Docker apt repository
      ansible.builtin.template:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        src: templates/docker.sources

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Install DOCKER-USER firewall script
      ansible.builtin.template:
        dest: /usr/local/sbin/pse-docker-user-rules
        mode: "0755"
        src: templates/pse-docker-user-rules

    - name: Install DOCKER-USER systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/pse-docker-user-rules.service
        mode: "0644"
        src: files/pse-docker-user-rules.service

    - name: Enable DOCKER-USER rules
      ansible.builtin.systemd:
        name: pse-docker-user-rules
        daemon_reload: true
        enabled: true
        state: restarted

    - name: Read back the live firewall rules
      ansible.builtin.command: iptables -S DOCKER-USER
      register: live_rules
      changed_when: false

    - name: Assert the live rules match the configured ports
      ansible.builtin.assert:
        that:
          - docker_allowed_ports | join(',') in live_rules.stdout
          - "'-j DROP' in live_rules.stdout"
        fail_msg: >-
          DOCKER-USER does not reflect {{ docker_allowed_ports | join(',') }}.
          The unit did not re-run, or the script failed part way through.
          Live chain: {{ live_rules.stdout | default('(empty)', true) | replace('\n', ' / ') }}
        success_msg: "DOCKER-USER permits {{ docker_allowed_ports | join(',') }} and drops the rest."

    - name: Allow the pse user to run docker without sudo
      ansible.builtin.user:
        name: "{{ pse_user }}"
        groups: docker
        append: true

    - name: Verify Docker works
      ansible.builtin.command: docker run hello-world
      changed_when: false
      register: hello

- name: Services
  hosts: pse
  become: true
  gather_facts: false
  vars:
    ansible_user: "{{ pse_user }}"
    pse_domain: "{{ lookup('file', playbook_dir + '/domain.txt').strip() }}"
    services_dir: "/home/{{ pse_user }}/docker-services"
  tasks:
    - name: Assert the domain file is usable
      ansible.builtin.assert:
        that:
          - pse_domain | length > 0
          - "' ' not in pse_domain"
        fail_msg: "domain.txt must hold a single bare domain, got '{{ pse_domain }}'"

    - name: Create the services directory
      ansible.builtin.file:
        path: "{{ services_dir }}/nginx"
        state: directory
        owner: "{{ pse_user }}"
        group: "{{ pse_user }}"
        mode: "0755"

    - name: Write the compose file
      ansible.builtin.copy:
        dest: "{{ services_dir }}/compose.yaml"
        owner: "{{ pse_user }}"
        group: "{{ pse_user }}"
        mode: "0644"
        src: files/compose.yaml

    - name: Write the nginx server config
      ansible.builtin.template:
        dest: "{{ services_dir }}/nginx/default.conf"
        owner: "{{ pse_user }}"
        group: "{{ pse_user }}"
        mode: "0644"
        src: templates/nginx/default.conf

    - name: Write the landing page
      ansible.builtin.template:
        dest: "{{ services_dir }}/nginx/index.html"
        owner: "{{ pse_user }}"
        group: "{{ pse_user }}"
        mode: "0644"
        src: templates/nginx/index.html

    - name: Allow HTTP through ufw
      ansible.builtin.command: ufw allow 80/tcp
      register: ufw_http
      changed_when: "'Rule added' in ufw_http.stdout"

    - name: Install the services systemd unit
      ansible.builtin.template:
        dest: /etc/systemd/system/pse-services.service
        mode: "0644"
        src: templates/pse-services.service

    - name: Enable the services at boot
      ansible.builtin.systemd:
        name: pse-services
        daemon_reload: true
        enabled: true
        state: restarted

    - name: Fetch the landing page
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ pse_domain }}"
        status_code: 200
        return_content: true
      register: landing

    - name: Assert the domain is being served
      ansible.builtin.assert:
        that:
          - pse_domain in landing.content
        fail_msg: >-
          {{ pse_domain }} is not in the response body, so the vhost is not
          matching. Body: {{ landing.content | default('(none returned)', true) | truncate(200) }}
